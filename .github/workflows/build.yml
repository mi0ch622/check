name: Build Full Smali

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Hidden API jar
        run: |
          mkdir -p libs
          # 从 Maven 中央仓库拉取包含隐藏 API 的 android.jar
          curl -L -o libs/android-hidden-api.jar https://repo1.maven.org/maven2/com/anggrayudi/android-hidden-api/30.0/android-hidden-api-30.0.jar

      - name: Compile Java to DEX
        run: |
          mkdir -p build_out
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | head -n 1)
          
          # 编译时同时包含官方 android.jar 和隐藏 api jar
          # 增加 --add-exports 允许访问 sun.misc 等内部包
          javac -source 1.8 -target 1.8 \
            -classpath "$ANDROID_JAR:libs/android-hidden-api.jar" \
            -d build_out \
            app/src/main/java/com/check/*.java
          
          D8_PATH=$(find $ANDROID_HOME/build-tools -name "d8" | sort -V | tail -n 1)
          
          # 打包 dex（注意：只打包我们的校验类，不打包隐藏 api jar 里的类）
          "$D8_PATH" --min-api 19 --output build_out build_out/com/check/*.class

      - name: Baksmali to Smali
        run: |
          curl -L -o baksmali.jar https://github.com/baksmali/smali/releases/download/v3.0.5/baksmali-3.0.5-fat.jar
          java -jar baksmali.jar d build_out/classes.dex -o smali_out
          cd smali_out && zip -r ../SignCheck_Full_Smali.zip com/

      - name: Upload Full Smali Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignCheck-Full-Smali
          path: SignCheck_Full_Smali.zip